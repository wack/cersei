[package]
name = "cersei-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent builder, agentic loop, streaming, and reporters for the Cersei SDK"
readme = "../../README.md"

[dependencies]
cersei-types = { workspace = true }
cersei-provider = { workspace = true }
cersei-tools = { workspace = true }
cersei-hooks = { workspace = true }
cersei-memory = { workspace = true }
cersei-mcp = { workspace = true }
cersei-compression = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tempfile = { workspace = true }

[features]
# Benchmark features — opt-in for general_agent_bench example.
jemalloc-bench = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
graph-bench    = ["cersei-memory/graph"]
bench-full     = ["jemalloc-bench", "graph-bench"]

[dependencies.tikv-jemallocator]
version  = "0.6"
optional = true

[dependencies.tikv-jemalloc-ctl]
version  = "0.6"
features = ["stats"]
optional = true

[dev-dependencies]
cersei-embeddings = { workspace = true }
tracing-subscriber = { workspace = true }
# `start_paused` in the runner retry tests needs tokio's test clock.
tokio = { workspace = true, features = ["test-util"] }

[[example]]
name = "general_agent_bench"
path = "benchmarks/general_agent_bench.rs"
